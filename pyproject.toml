[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "q-arbor"
version = "0.1.0"
description = "A task-neutral, auditable research harness for quantitative experimentation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Jiayi Hu"}]
dependencies = [
  "jsonschema[format]>=4.23,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "build>=1.2,<2",
]

[project.scripts]
q-arbor-contract = "q_arbor.contracts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
q_arbor = ["py.typed", "spec/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
